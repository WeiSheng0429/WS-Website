<body>
    <!--Loading Screen -->
    <div id="preloader">
        <div class="loadingscreen">
            <img src="../images_files/loading_gif.gif" alt="Loading" class="loading-gif">
            <h1>Loading...</h1>
        </div>
    </div>

    <!-- Navigation Bar -->

    <div class="contact-page">
        <!-- Contact Section -->
        <div class="contact-title">
            <h1>
                <span>Let's start</span>
                <span>a project</span>
            </h1>
        </div>

        <div class="contact-container">
            <!-- Form Section -->
            <form class="contact-form" id="contactForm" action="#" method="POST">
                <div class="form-group">
                    <label for="name">What's your name?</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">What's your email?</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="johndoe123@gmail.com"
                        required>
                </div>
                <div class="form-group">
                    <label for="services">What services are you looking for?</label>
                    <input type="text" class="form-control" id="services" name="services"
                        placeholder="UX/UI Design, Branding, Development ..." required>
                </div>
                <div class="form-group">
                    <label for="project-details">Tell me more about your project</label>
                    <textarea class="form-control" id="project-details" name="project_details" rows="5"
                        placeholder="Hey Wei Sheng, can you help me with..." required></textarea>
                </div>
                <button type="submit" class="btn-contact btn-primary">Submit</button>
            </form>

            <!-- Contact Information Section -->
            <div class="contact-info">
                <div class="profile-picture">
                    <img src="../images_files/WS_Logo.png" alt="WsLogo" class="circle-img">
                </div>
                <div class="info-details">
                    <h1>Email: <h1>
                            <p>w.weisheng0429@gmail.com</p>
                            <p>+65 9620 0375</p>
                            <div class="social-icons">
                                <h1>Find Me On:</h1>
                                <a href="https://www.linkedin.com/in/wong-wei-sheng-1835b11a3/"><i
                                        class="fa-brands fa-linkedin"></i></a>
                                <a href="https://github.com/WeiSheng0429"><i class="fa-brands fa-github"></i></a>
                                <a href="https://www.facebook.com/W.Sheng0429"><i class="fa-brands fa-facebook"></i></a>
                                <a href="https://www.instagram.com/weisheng_0429/"><i
                                        class="fa-brands fa-instagram"></i></a>
                            </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js_files/script.js"></script>
